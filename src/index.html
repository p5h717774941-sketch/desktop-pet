<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinkmo</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <div id="stage">
      <div id="empty">
        <div class="big">🐾</div>
        <div class="txt">点左上角「上传宠物」添加第一只</div>
      </div>
    </div>

    <div id="panel">
      <h1><span class="dot"></span>Pinkmo <small>v1.9.2</small></h1>
      <div class="row">
        <button class="primary" id="uploadBtn">+ 上传宠物</button>
        <button id="collapseBtn">收起</button>
      </div>

      <div id="modePicker" class="mode-picker" style="display: none">
        <button class="mode-btn" id="modeImage">
          <span class="m-name">单图模式</span>
          <span class="m-desc">上传照片直接用</span>
        </button>
        <button class="mode-btn" id="modeSpriteDemo">
          <span class="m-name">2D 灵动 · 示例</span>
          <span class="m-desc">内置小精灵，先试效果</span>
        </button>
        <button class="mode-btn" id="modeSpriteUpload">
          <span class="m-name">2D 灵动 · 自定义</span>
          <span class="m-desc">传帧图，可配 config.json</span>
        </button>
        <button class="mode-btn disabled" disabled>
          <span class="m-name">3D 逼真</span>
          <span class="m-desc">VRM · 开发中</span>
        </button>
      </div>

      <input type="file" id="file" accept="image/*" multiple style="display: none" />
      <input type="file" id="spriteFile" accept="image/*,.json" multiple style="display: none" />

      <div class="section-title">宠物仓库</div>
      <div id="petWarehouse"></div>

      <div class="section-title">提醒</div>
      <div id="reminderList"></div>
      <button id="addReminder" class="add-btn">+ 新增提醒</button>
      <div class="hint">提醒时宠物会跳到屏幕中央喊你。时间 / 话语 / 重复频率都由你定。</div>
      <div class="hint brand">🐭 黑鼠制作</div>
    </div>

    <button id="toggleBtn">🐾</button>
    <div id="brand">🐭 黑鼠制作</div>
  </body>
</html>
